<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prevido - Prijava</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-2">Prevido</h1>
        <p class="text-gray-500 text-center mb-6">Video Translator</p>
        
        {% if error %}
        <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/login">
            <label class="block text-sm font-medium text-gray-700 mb-1">Lozinka / Password</label>
            <input type="password" name="password" required
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
                Prijava / Login
            </button>
        </form>
    </div>
</body>
</html>
